# LoadBalancer service. On Minikube run `minikube tunnel` to get an external IP;
# on GKE/EKS/AKS the cloud provisions a real load balancer.
apiVersion: v1
kind: Service
metadata:
  name: cardiorisk-api
  namespace: cardiorisk
  labels:
    app.kubernetes.io/name: cardiorisk-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cardiorisk-api
  ports:
    - name: http
      port: 80
      targetPort: http
