# CardioRisk CI/CD
#   lint -> test -> train -> docker build + smoke test -> deploy to ephemeral kind cluster
# Any failing step fails the job, and every downstream job is skipped (`needs:`).
name: cardiorisk-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      quick:
        description: "Use tiny hyper-parameter grids"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE: cardiorisk-api

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.16.10
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: Unit tests (pytest)
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Record resolved dependency versions
        run: mkdir -p reports && pip freeze | tee reports/pip-freeze.txt
      - name: pytest
        run: |
          pytest -v --junitxml=reports/junit.xml \
                 --cov=cardiorisk --cov-report=term-missing --cov-report=xml:reports/coverage.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            reports/*.xml
            reports/pip-freeze.txt

  train:
    name: Data + EDA + training (MLflow)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Download & clean dataset
        run: python scripts/download_data.py --force
      - name: EDA figures
        run: python scripts/run_eda.py
      - name: Train, tune & register model
        run: |
          rm -f mlflow.db && rm -rf mlruns
          if [ "${{ inputs.quick }}" = "true" ]; then python -m cardiorisk.train --quick; else python -m cardiorisk.train; fi | tee train_output.json
      - name: Quality gate (hold-out ROC-AUC >= 0.80)
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("models/metadata.json"))
          auc = m["test_metrics"]["test_roc_auc"]
          print(f"winner={m['model_name']} test_roc_auc={auc}")
          sys.exit(0 if auc >= 0.80 else "ROC-AUC below release gate")
          EOF
      - name: Job summary
        run: |
          {
            echo "### Model training"
            echo '```json'; cat models/metadata.json; echo '```'
            echo "#### Model comparison (5-fold CV + hold-out)"
            echo '```'
            python -c "import pandas as pd; print(pd.read_csv('reports/figures/model_comparison.csv', index_col=0).T.to_string())"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: |
            models/model.joblib
            models/metadata.json
            models/mlflow_model/
      - uses: actions/upload-artifact@v7
        with:
          name: mlflow-tracking
          path: |
            mlflow.db
            mlruns/
      - uses: actions/upload-artifact@v7
        with:
          name: eda-and-evaluation-figures
          path: reports/figures/

  docker:
    name: Build image + container smoke test
    needs: train
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: model
          path: models
      - name: Build
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:1.0.0 .
      - name: Run container
        run: docker run -d --name api -p 8000:8000 $IMAGE:1.0.0
      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:8000
      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tee container.log
      - name: Save image
        run: docker save $IMAGE:1.0.0 | gzip > image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-logs
          path: container.log

  deploy:
    name: Deploy to Kubernetes (kind) + verify
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
      - uses: helm/kind-action@v1
        with:
          cluster_name: cardiorisk
      - name: Load image into cluster
        run: |
          docker load < image.tar.gz
          kind load docker-image $IMAGE:1.0.0 --name cardiorisk
      - name: Apply manifests
        run: |
          kubectl apply -k deploy/k8s
          kubectl apply -k deploy/monitoring
          kubectl -n cardiorisk rollout status deploy/cardiorisk-api --timeout=180s
          kubectl -n cardiorisk rollout status deploy/prometheus --timeout=180s
      - name: Verify endpoints through the Service
        run: |
          kubectl -n cardiorisk port-forward svc/cardiorisk-api 8080:80 &
          sleep 5
          bash scripts/smoke_test.sh http://localhost:8080
      - name: Verify Prometheus is scraping every replica
        run: |
          kubectl -n cardiorisk port-forward svc/prometheus 9090:9090 &
          for i in $(seq 1 20); do
            sleep 5
            curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=up{job="cardiorisk-api"}' > up.json || continue
            n=$(python3 -c "import json; r=json.load(open('up.json'))['data']['result']; print(sum(x['value'][1]=='1' for x in r))")
            echo "attempt $i: $n API replicas up"
            [ "$n" -ge 2 ] && exit 0
          done
          cat up.json; echo "Prometheus did not discover >=2 healthy replicas"; exit 1
      - name: Cluster state
        if: always()
        run: |
          {
            kubectl get all,ingress,hpa -n cardiorisk -o wide
            echo; kubectl -n cardiorisk describe deploy/cardiorisk-api
            echo; kubectl -n cardiorisk logs -l app.kubernetes.io/name=cardiorisk-api --tail=50
          } | tee k8s-state.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k8s-deployment-state
          path: k8s-state.txt
